# GCP: JanusGraph on Cloud Bigtable (HBase API) + Elasticsearch (or Elastic Cloud on GCP) for mixed indexes.
gremlin.graph=org.janusgraph.core.JanusGraphFactory
storage.backend=hbase
storage.hbase.ext.hbase.client.connection.impl=com.google.cloud.bigtable.hbase2_x.BigtableConnection
storage.hbase.ext.google.bigtable.project.id=YOUR_GCP_PROJECT
storage.hbase.ext.google.bigtable.instance.id=YOUR_BIGTABLE_INSTANCE
storage.hbase.table=css_kg
index.search.backend=elasticsearch
index.search.hostname=YOUR_ES_HOST
index.search.elasticsearch.http.auth.type=basic
schema.default=none
