# Local JanusGraph, no docker: embedded BerkeleyDB-JE storage + Lucene index (single machine).
gremlin.graph=org.janusgraph.core.JanusGraphFactory
storage.backend=berkeleyje
storage.directory=../../var/janusgraph/berkeley
index.search.backend=lucene
index.search.directory=../../var/janusgraph/lucene
schema.default=none
